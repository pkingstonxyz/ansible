bugfixes:
  - git - avoid resolving the remote ``HEAD`` when shallow-fetching an explicit tag, branch, or refspec from a detached checkout, which crashed when the remote ``HEAD`` reference was missing (https://github.com/ansible/ansible/issues/87881).
  - git - report an actionable error instead of an exception when ``version=HEAD`` cannot resolve the current branch or the remote ``HEAD`` reference (https://github.com/ansible/ansible/issues/87881).
  - git - a shallow fetch no longer force-updates the local branch ref, so a branch holding unpushed commits now fails with the existing ``local commits will be lost`` error instead of being silently reset. Use ``force=true`` to overwrite them as before.
  - git - update ``refs/heads/<branch>`` when shallow-fetching into a bare repository, which bare repositories otherwise never advance because they skip the checkout step (https://github.com/ansible/ansible/issues/87881).
