bugfixes:
  - git - avoid resolving the remote ``HEAD`` when shallow-fetching an explicit tag, branch, or refspec from a detached checkout, which crashed when the remote ``HEAD`` reference was missing (https://github.com/ansible/ansible/issues/87881).
  - git - report an actionable error instead of an exception when ``version=HEAD`` cannot resolve the current branch or the remote ``HEAD`` reference (https://github.com/ansible/ansible/issues/87881).
