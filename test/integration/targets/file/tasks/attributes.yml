# file module tests for the attributes parameter

- name: define file to verify chattr/lsattr with
  set_fact:
    attributes_file: "{{ remote_tmp_dir }}/attributes.txt"
    attributes_supported: no
    # 'd' sorts after 'A' in ASCII but before it in lsattr's output order
    test_attributes: Ad

- name: create file to verify chattr/lsattr with
  command: touch "{{ attributes_file }}"

- name: add "A" attribute to file
  command: chattr +A "{{ attributes_file }}"
  ignore_errors: yes

- name: get attributes from file
  command: lsattr -d "{{ attributes_file }}"
  register: attribute_A_set
  ignore_errors: yes

- name: remove "A" attribute from file
  command: chattr -A "{{ attributes_file }}"
  ignore_errors: yes

- name: get attributes from file
  command: lsattr -d "{{ attributes_file }}"
  register: attribute_A_unset
  ignore_errors: yes

- name: determine if chattr/lsattr is supported
  set_fact:
    attributes_supported: yes
  when:
    - attribute_A_set is success
    - attribute_A_set.stdout_lines is truthy
    - "'A' in attribute_A_set.stdout_lines[0].split()[0]"
    - attribute_A_unset is success
    - attribute_A_unset.stdout_lines is truthy
    - "'A' not in attribute_A_unset.stdout_lines[0].split()[0]"

- name: Test the attributes parameter
  when: attributes_supported
  block:
    # 'A' and 'd' are the only attributes tmpfs supports
    - name: Create the file to test attributes with
      file:
        path: "{{ attributes_file }}"
        state: touch
        attributes: "-{{ test_attributes }}"

    - name: Run the attribute test cases
      include_tasks: attributes_case.yml
      loop:
        - name: add the test attributes
          attributes: "+{{ test_attributes }}"
          changed: true
          # lsattr prints 'd' immediately ahead of 'A', unlike an alphabetical sort
          after_contains: [A, d, dA]

        - name: add the same attributes again
          attributes: "+{{ test_attributes }}"
          changed: false

        - name: remove one attribute in check mode
          attributes: "-A"
          check_mode: true
          changed: true
          before_contains: [A]
          after_excludes: [A]

        - name: remove one attribute
          attributes: "-A"
          changed: true
          before_contains: [A, dA]
          after_contains: [d]
          after_excludes: [A]

        - name: remove the remaining attributes
          attributes: "-{{ test_attributes }}"
          changed: true
      loop_control:
        label: "{{ item.name }}"

    - name: Set an attribute outside of the module
      command: chattr +d "{{ attributes_file }}"

    - name: Add a different attribute with the module
      file:
        path: "{{ attributes_file }}"
        attributes: +A
      register: preserve_result

    - name: Read the resulting attributes back from the filesystem
      command: lsattr -d "{{ attributes_file }}"
      register: preserve_lsattr

    - name: Verify adding an attribute preserved the one set outside the module
      assert:
        that:
          - preserve_result is changed
          - "'A' in preserve_lsattr.stdout_lines[0].split()[0]"
          - "'d' in preserve_lsattr.stdout_lines[0].split()[0]"

    - name: Remove the attributes used for the preservation test
      file:
        path: "{{ attributes_file }}"
        attributes: "-{{ test_attributes }}"

    # assigning attributes explicitly clears the ones not listed, which fails on
    # filesystems reporting flags chattr cannot set, such as 'e' on ext4
    - name: Check whether explicit attribute assignment is supported
      command: chattr "={{ test_attributes }}" "{{ attributes_file }}"
      register: set_exact_probe
      ignore_errors: yes

    - name: Remove the attributes set by the probe
      command: chattr "-{{ test_attributes }}" "{{ attributes_file }}"
      ignore_errors: yes

    - name: Run the explicit assignment test cases
      include_tasks: attributes_case.yml
      loop:
        - name: set the test attributes explicitly
          attributes: "{{ test_attributes }}"
          changed: true
          after_contains: [A, d]

        - name: clear every attribute
          attributes: ""
          changed: true
          after_excludes: [A, d]
      loop_control:
        label: "{{ item.name }}"
      when: set_exact_probe is success

  always:
    - name: Remove the attributes test file
      file:
        path: "{{ attributes_file }}"
        state: absent
