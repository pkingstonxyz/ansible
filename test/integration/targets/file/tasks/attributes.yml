# file module tests for the attributes parameter

- name: define file to verify chattr/lsattr with
  set_fact:
    attributes_file: "{{ remote_tmp_dir }}/attributes.txt"
    attributes_supported: no
    # 'd' sorts after 'A' in ASCII but before it in lsattr's output order
    test_attributes: Ad

- name: create file to verify chattr/lsattr with
  command: touch "{{ attributes_file }}"

- name: add "A" attribute to file
  command: chattr +A "{{ attributes_file }}"
  ignore_errors: yes

- name: get attributes from file
  command: lsattr -d "{{ attributes_file }}"
  register: attribute_A_set
  ignore_errors: yes

- name: remove "A" attribute from file
  command: chattr -A "{{ attributes_file }}"
  ignore_errors: yes

- name: get attributes from file
  command: lsattr -d "{{ attributes_file }}"
  register: attribute_A_unset
  ignore_errors: yes

- name: determine if chattr/lsattr is supported
  set_fact:
    attributes_supported: yes
  when:
    - attribute_A_set is success
    - attribute_A_set.stdout_lines is truthy
    - "'A' in attribute_A_set.stdout_lines[0].split()[0]"
    - attribute_A_unset is success
    - attribute_A_unset.stdout_lines is truthy
    - "'A' not in attribute_A_unset.stdout_lines[0].split()[0]"

- name: Test the attributes parameter
  block:
    # 'A' and 'd' are the only attributes tmpfs supports
    - name: Create the file to test attributes with
      file:
        path: "{{ attributes_file }}"
        state: touch
        attributes: "-{{ test_attributes }}"

    - name: Add the test attributes
      file:
        path: "{{ attributes_file }}"
        attributes: "+{{ test_attributes }}"
      register: add_result
      diff: true

    - name: Verify adding attributes reported a change and a consistent diff
      assert:
        that:
          - add_result is changed
          # both sides use the same ordering, so they can be compared directly
          - add_result.diff.before.attributes == add_result.diff.before.attributes | sort(case_sensitive=true) | join('')
          - add_result.diff.after.attributes == add_result.diff.after.attributes | sort(case_sensitive=true) | join('')
          - "'A' in add_result.diff.after.attributes"
          - "'d' in add_result.diff.after.attributes"

    - name: Add the same attributes again
      file:
        path: "{{ attributes_file }}"
        attributes: "+{{ test_attributes }}"
      register: readd_result

    - name: Verify re-adding the same attributes reported no change
      assert:
        that:
          - readd_result is not changed

    - name: Remove one attribute in check mode
      file:
        path: "{{ attributes_file }}"
        attributes: "-A"
      register: check_mode_result
      check_mode: true
      diff: true

    - name: Verify check mode reported the change
      assert:
        that:
          - check_mode_result is changed
          - "'A' in check_mode_result.diff.before.attributes"
          - "'A' not in check_mode_result.diff.after.attributes"

    - name: Remove one attribute
      file:
        path: "{{ attributes_file }}"
        attributes: "-A"
      register: remove_result
      diff: true

    - name: Verify removing one attribute left the others in place
      assert:
        that:
          - remove_result is changed
          - remove_result.diff.before.attributes == remove_result.diff.before.attributes | sort(case_sensitive=true) | join('')
          - remove_result.diff.after.attributes == remove_result.diff.after.attributes | sort(case_sensitive=true) | join('')
          - "'A' in remove_result.diff.before.attributes"
          - "'A' not in remove_result.diff.after.attributes"
          - "'d' in remove_result.diff.after.attributes"

    - name: Remove the remaining test attributes
      file:
        path: "{{ attributes_file }}"
        attributes: "-{{ test_attributes }}"
      register: cleanup_result

    - name: Verify the remaining test attributes were removed
      assert:
        that:
          - cleanup_result is changed

    - name: explicitly set file attribute "A"
      file: path={{ attributes_file }} attributes=A
      register: file_attributes_result
      ignore_errors: True
      when: attributes_supported

    - name: remove file attribute "A"
      file: path={{ attributes_file }} attributes=-A
      register: file_attributes_result_3
      ignore_errors: True

    - name: explicitly remove file attributes
      file: path={{ attributes_file }} attributes=""
      register: file_attributes_result_4
      when: file_attributes_result_3 is changed

    - name: verify that the file was not marked as changed
      assert:
        that:
          - "file_attributes_result_4 is not changed"
      when: file_attributes_result_4 is changed

  always:
    - name: Remove the attributes test file
      file:
        path: "{{ attributes_file }}"
        state: absent
